# CaratForUs — Shopify app configuration (AUTHORITATIVE).
#
# Generated by `shopify app config link` against the existing
# "caratforus-development" app, then reconciled by hand against
# docs/ARCHITECTURE-MVP1.md §5 and against the D13 library integration.
#
# Development store: caratforus-dev.myshopify.com
#
# NOTHING HERE IS SECRET. client_id is a public identifier — it ships in the
# app frontend. The client SECRET lives only in app/.env (gitignored) and is
# never written to this file.
#
# NOT YET DEPLOYED. Nothing below has been pushed to the app record:
# `shopify app deploy` has deliberately not been run.

name = "caratforus-development"
client_id = "f54993df6c413ea67db6fc065a2ebe88"

# PLACEHOLDER, AND INTENTIONALLY SO FOR DEVELOPMENT.
#
# There is no stable development URL to put here. `shopify app dev` mints a
# fresh tunnel hostname on every run and — because
# automatically_update_urls_on_dev is true below — rewrites this field and
# redirect_urls to match, for the duration of that session. Hard-coding a
# tunnel hostname would be stale within one run.
#
# A real value is needed only for a deployed staging/production install, at
# which point it becomes that deployment's origin.
application_url = "https://example.com"

embedded = true

[access_scopes]
# LEAST PRIVILEGE, NARROWED DELIBERATELY.
#
# `shopify app config link` returned scopes = "" — the app requested nothing,
# so no Admin API call could have succeeded. These are the scopes Slice 2
# actually needs and no more:
#
#   read_products   read variant ids/prices to compare before publishing
#   write_products  publish a recalculated price to a variant
#
# Architecture §5 documents a wider set. That is a ROADMAP, not a day-one
# grant: nothing in the codebase exercises any of it yet, and requesting
# standing access to orders and customer PII months early is what least
# privilege exists to prevent. Each is added in the slice that first needs it.
#
# Must stay in step with SHOPIFY_SCOPES in app/.env, which is what
# app/shopify.server.ts passes to the library.
scopes = "read_products,write_products"
optional_scopes = [ ]

# Token exchange rather than the legacy OAuth redirect dance.
use_legacy_install_flow = false

[auth]
# DERIVED FROM THE INSTALLED LIBRARY, NOT GUESSED.
#
# @shopify/shopify-app-react-router@3.0.0 builds its auth paths from
# `authPathPrefix`, which app/shopify.server.ts sets explicitly to "/auth"
# (see shopify-app.js: callbackPath = `${authPathPrefix}/callback`). The paths
# it produces are asserted in app/shopify.server.test.ts against the AUTH_PATHS
# export, so this list and the code cannot drift apart silently.
#
# Only the CALLBACK is registered. /auth/login, /auth/session-token and
# /auth/exit-iframe are app-internal navigation, not OAuth redirect targets.
#
# The host below is the placeholder application_url. `shopify app dev` replaces
# both with the live tunnel while a dev session is running.
redirect_urls = [ "https://example.com/auth/callback" ]

[webhooks]
# The CLI reported 2026-07 from the app record. Architecture, .env.example and
# app/shopify.server.ts all match it now; a mismatch between the version an app
# is pinned to and the version its client sends surfaces months later as an
# inexplicable missing field.
api_version = "2026-07"

  [webhooks.privacy_compliance]
  # Shopify's mandatory compliance topics. The handlers already exist and are
  # OURS, not the Shopify library's: every inbound request has its HMAC
  # verified over the raw body before any parsing, and processing is
  # deduplicated and idempotent (app/shopify/webhooks/receive.server.ts).
  #
  # Adopting the library did NOT change this. There is no `webhooks` key in
  # shopifyApp(), no route calls the library's webhook authenticator, and
  # app/shopify/webhooks/boundaryPreserved.test.ts fails the build if either
  # becomes untrue.
  #
  # Paths are relative to application_url and map to the flat routes in
  # app/routes/. UNVALIDATED until the first `shopify app deploy`: the CLI
  # checks these server-side, so treat that deploy as the test.
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

# No business webhook subscriptions yet. Slice 2 introduces the first (product
# and order topics); declaring one before its handler exists would have Shopify
# deliver to a 404 and retry.

[app_proxy]
# Storefront requests to
#   https://caratforus-dev.myshopify.com/apps/carat/...
# are forwarded by Shopify to <application_url>/apps/carat/... and verified by
# app/shopify/proxy/verify.ts.
#
# The host tracks application_url and is therefore also a development
# placeholder, updated by `shopify app dev`. `subpath` must stay equal to
# SHOPIFY_APP_PROXY_SUBPATH in app/.env, which the signature check reads.
url = "https://example.com/apps/carat"
subpath = "carat"
prefix = "apps"

[build]
# Names the store `shopify app dev` opens, so the dev session cannot be pointed
# at the wrong shop by accident.
dev_store_url = "caratforus-dev.myshopify.com"

# Lets the CLI rewrite application_url, redirect_urls and the proxy URL to the
# session's tunnel while `shopify app dev` runs. This is what makes the
# placeholders above workable rather than blocking: the alternative is editing
# three URLs by hand on every run, which is how they end up stale and wrong.
automatically_update_urls_on_dev = true
