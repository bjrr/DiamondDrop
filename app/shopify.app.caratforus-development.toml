# CaratForUs — Shopify app configuration (AUTHORITATIVE).
#
# Generated by `shopify app config link` against the existing
# "caratforus-development" app, then reconciled by hand against
# docs/ARCHITECTURE-MVP1.md §5 and against the D13 library integration.
#
# Development store: caratforus-dev.myshopify.com
#
# NOTHING HERE IS SECRET. client_id is a public identifier — it ships in the
# app frontend. The client SECRET lives only in app/.env (gitignored) and is
# never written to this file.
#
# NOT YET DEPLOYED. Nothing below has been pushed to the app record:
# `shopify app deploy` has deliberately not been run.

name = "caratforus-development"
client_id = "f54993df6c413ea67db6fc065a2ebe88"

# THE CURRENT DEV TUNNEL, baked in for this deploy.
#
# EXPECT THIS TO GO STALE. The Shopify CLI mints a fresh tunnel hostname on
# every `shopify app dev` run, so this value is correct only for the session it
# was captured from. That is tolerable because
# automatically_update_urls_on_dev = true means each dev run overwrites the
# app record's URLs with its own tunnel — the stale value here never reaches a
# running session.
#
# It is written down rather than left as https://example.com so that this
# deploy does not overwrite the live session's URLs and break the embedded app
# that is currently working.
#
# A deployed staging/production install needs a real hosted origin here, and
# that replaces this line rather than living alongside it.
application_url = "https://caratforus.fly.dev"

embedded = true

[access_scopes]
# LEAST PRIVILEGE, NARROWED DELIBERATELY.
#
# `shopify app config link` returned scopes = "" — the app requested nothing,
# so no Admin API call could have succeeded. These are the scopes Slice 2
# actually needs and no more:
#
#   read_products    read variant ids/prices to compare before publishing
#   write_products   publish a recalculated price to a variant
#   read_inventory   R17 (owner ruling, 2026-09-20) — resolve
#                    inventory_levels/update deliveries and re-query real
#                    availability. Added ONLY after live evidence against
#                    caratforus-dev showed variants/out_of_stock and
#                    variants/in_stock (product-scope topics) simply do not
#                    fire for a real transition, while products/update did,
#                    on identical conditions. Deliberately NOT
#                    write_inventory — this app only ever OBSERVES stock,
#                    never changes it.
#   write_draft_orders
#                    Slice 2C. Bank Payment Checkout creates a draft order,
#                    sends its invoice and completes it through the manual
#                    gateway once payment is verified by hand. Shopify grants
#                    read with write, so read_draft_orders is not requested
#                    separately.
#   read_orders      Slice 2C, discovered by live verification rather than
#                    planned. draftOrderComplete returns the order it created
#                    (draftOrder { order { id name } }) and that field is
#                    gated on read_orders, so without it the lifecycle stops
#                    at completion and bank_payment_order.shopify_order_gid
#                    can never be filled. READ only: the app records which
#                    order its draft became and never edits one.
#   write_orders     Slice 3 D28 (owner ruling, 2026-09-24). ONLY use is
#                    `tagsAdd` on a real Shopify order — a Luxury Steal
#                    identifying tag when every line's acknowledgment is
#                    verified, an obvious review tag when one is not
#                    (docs/specs/SLICE-3-LUXURY-STEALS.md §D28, criteria
#                    137-140). The app still never edits an order's line
#                    items, price, shipping or financial state — tagging is
#                    the entire surface this scope is exercised for. (The
#                    draft-order note above, "the app never edits a real
#                    order, only the draft it created," predates this and no
#                    longer holds without qualification — tags are the one,
#                    deliberate exception, not a general order-write grant.)
#   read_merchant_managed_fulfillment_orders
#                    Slice 3 D28. Reads the fulfilment order(s) belonging to
#                    an order so an unverified Luxury Steal line's hold can be
#                    targeted at the actual affected fulfilment order(s),
#                    never guessed. READ only.
#   write_merchant_managed_fulfillment_orders
#                    Slice 3 D28 (owner-approved option (a) from the spec's
#                    D28 discussion). Places a real fulfilment hold
#                    (`fulfillmentOrderHold`) on an order with an unmatched
#                    Luxury Steal line — the binding backstop D6's declined
#                    validation Function otherwise leaves missing; see
#                    luxuryStealOrderHandler.server.ts. "merchant_managed"
#                    only: NOT the third-party or assigned-fulfilment scope
#                    families — the owner was explicit that those are not
#                    requested unless a real CaratForUs fulfilment location
#                    needs them AND live evidence demonstrates it.
#
# Architecture §5 documents a wider set. That is a ROADMAP, not a day-one
# grant: nothing in the codebase exercises any of it yet, and requesting
# standing access to orders and customer PII months early is what least
# privilege exists to prevent. Each is added in the slice that first needs it.
#
# Must stay in step with SHOPIFY_SCOPES in app/.env, which is what
# app/shopify.server.ts passes to the library.
#
# ADDING THIS SCOPE RE-PROMPTS OAUTH on the dev store — expected, not a bug.
# Slice 3 D28's three additions below require a fresh re-consent, which the
# architect is running separately (see luxuryStealOrderHandler.server.ts's
# own doc comment) — this file records the target state; it has not itself
# been pushed (`shopify app deploy` has deliberately not been run — see the
# file header).
#   read_customers   Owner-approved 2026-09-29, after the Slice 5 live gate
#                    proved the need rather than argued it. `Order.customer`
#                    is denied without this scope, and BOTH the warranty and
#                    RMA order lookups query `customer { id }` to answer the
#                    only question that matters at intake: does this order
#                    belong to the customer asking? Without it every warranty
#                    claim and every RMA in production returns 502
#                    `order_lookup_failed` — fail-closed, so nothing wrong is
#                    ever written, but the features simply do not work.
#
#                    ONLY BECAUSE OWNERSHIP DEMANDS IT. `write_customers` was
#                    explicitly REFUSED by the owner on 2026-09-29 when it was
#                    wanted merely to automate test fixtures. THAT REFUSAL
#                    STILL STANDS FOR THAT PURPOSE: live gates use customers
#                    created by hand, and no test fixture may be automated
#                    through this scope. See the separate entry below for the
#                    one narrow purpose it was later granted for.
#   write_customers  Owner-directed 2026-11-04, and NARROWER than the 2026-09-29
#                    refusal above rather than a reversal of it.
#
#                    A real signup proved that Shopify's native
#                    `{% form 'customer' %}` DISCARDS `contact[phone]`. The
#                    owner's instruction was to store the optional First Access
#                    mobile number "into Shopify's real customer `phone` field",
#                    with "Shopify as the only source of truth" and explicitly
#                    no second customer database or CRM. There is no way to
#                    satisfy that without a customer write; the scope is the
#                    feature, not a convenience.
#
#                    THE ONLY EXERCISED SURFACE is
#                    `firstAccessCustomer.server.ts`: `customerUpdate` for
#                    first name, last name and phone, plus `tagsAdd`. It
#                    cannot create a customer, cannot delete one, cannot clear
#                    a field, cannot remove a tag, and refuses any customer not
#                    already carrying `first-access`. Those limits are pinned
#                    by `firstAccessPhoneFence.test.ts`, which fails if a
#                    create/delete mutation or `CustomerInput.tags` appears.
#
#                    NOT a licence to automate test fixtures — see above. Not a
#                    licence to set SMS marketing consent, which the same fence
#                    forbids outright.
#
#                    Do NOT "solve" a future scope problem by trusting a
#                    browser-supplied customer id, email, or order number:
#                    ownership is established from the App Proxy's signed
#                    `logged_in_customer_id` against an order retrieved
#                    server-side, and a missing scope must keep failing
#                    closed rather than degrade to a weaker check.
#
#  read_metaobjects   ADDED 2026-11-01. READ ONLY, and only for Metaobject
#                     Events.
#
#                     Set Your Own Stone stores each real centre size as an
#                     app-owned metaobject ($app:syos_center_size_profile)
#                     holding shape and nominal dimensions. Reading AND
#                     WRITING those entries needs no metaobject scope --
#                     Shopify exempted app-owned metaobjects in 2026-04, and
#                     that was verified with this app token before anything
#                     was requested.
#
#                     What is NOT exempt is the native Metaobject EVENTS
#                     topic. Tested directly on the current grant:
#                     METAOBJECTS_UPDATE returned
#                       "You cannot create a webhook subscription with the
#                        specified topic"
#
#                     It is needed because a merchant can edit a size
#                     profile from 10.0 x 7.0 to 10.5 x 7.0 WITHOUT touching
#                     any product: linkedMetafieldValue does not change, so
#                     no Product event fires. The derived index would keep
#                     classifying stones against the old dimensions, which
#                     is a FALSE COMPATIBILITY RESULT rather than stale
#                     display. Scheduled reconciliation is recovery, not a
#                     substitute (owner correction 2026-11-01).
#
#                     write_metaobjects is deliberately NOT requested. The
#                     app writes its own app-owned entries without it, and
#                     it never writes merchant-owned metaobjects.
#
#   read_files        Group Buy campaign imagery (owner approval,
#                     2026-11-06). The Group Buy campaign builder opens
#                     Shopify's NATIVE file picker through the App Home
#                     Intents API (`pick:shopify/File`). That intent returns
#                     only an array of file IDs — `response.data.ids` — and
#                     nothing else: no URL, no alt text, no media type. So
#                     the only way to turn a merchant's selection into
#                     something renderable, or to confirm that what came back
#                     is a MediaImage belonging to this shop rather than an
#                     id a tampered form invented, is to resolve those ids
#                     against the Admin API. That is the concrete need, and
#                     it is a READ.
#
#                     write_files is deliberately NOT requested. Merchants
#                     upload through Shopify Files (or through the picker's
#                     own upload affordance, which is Shopify's code and
#                     Shopify's permission, not ours). The app never creates,
#                     replaces or deletes a merchant's file, so asking for
#                     the ability to would be a privilege nothing uses.
scopes = "read_products,write_products,read_inventory,read_customers,write_customers,write_draft_orders,read_orders,write_payment_terms,write_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_metaobjects,read_files"
optional_scopes = [ ]

# Token exchange rather than the legacy OAuth redirect dance.
use_legacy_install_flow = false

[auth]
# DERIVED FROM THE INSTALLED LIBRARY, NOT GUESSED.
#
# @shopify/shopify-app-react-router@3.0.0 builds its auth paths from
# `authPathPrefix`, which app/shopify.server.ts sets explicitly to "/auth"
# (see shopify-app.js: callbackPath = `${authPathPrefix}/callback`). The paths
# it produces are asserted in app/shopify.server.test.ts against the AUTH_PATHS
# export, so this list and the code cannot drift apart silently.
#
# Only the CALLBACK is registered. /auth/login, /auth/session-token and
# /auth/exit-iframe are app-internal navigation, not OAuth redirect targets.
#
# Matches application_url above. `shopify app dev` replaces both with whatever
# tunnel that session mints.
redirect_urls = [ "https://caratforus.fly.dev/auth/callback" ]

[webhooks]
# The CLI reported 2026-07 from the app record. Architecture, .env.example and
# app/shopify.server.ts all match it now; a mismatch between the version an app
# is pinned to and the version its client sends surfaces months later as an
# inexplicable missing field.
api_version = "2026-07"

  [webhooks.privacy_compliance]
  # Shopify's mandatory compliance topics. The handlers already exist and are
  # OURS, not the Shopify library's: every inbound request has its HMAC
  # verified over the raw body before any parsing, and processing is
  # deduplicated and idempotent (app/shopify/webhooks/receive.server.ts).
  #
  # Adopting the library did NOT change this. There is no `webhooks` key in
  # shopifyApp(), no route calls the library's webhook authenticator, and
  # app/shopify/webhooks/boundaryPreserved.test.ts fails the build if either
  # becomes untrue.
  #
  # Paths are relative to application_url and map to the flat routes in
  # app/routes/. UNVALIDATED until the first `shopify app deploy`: the CLI
  # checks these server-side, so treat that deploy as the test.
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

  # Stage 2B / owner rulings R15 then R17 (2026-09-20, owner exit proof P2).
  # These two topics are the event-driven trigger for recomputing a product's
  # "as low as" figure — see app/shopify/webhooks/inventoryPurchasabilityHandler.server.ts.
  #
  # R15 ORIGINALLY CHOSE variants/out_of_stock + variants/in_stock, precisely
  # to avoid requesting `read_inventory`. R17 SUPERSEDES THAT, on live
  # evidence rather than assumption: driven against a real product
  # (caratforus-dev, ACTIVE + published + inventory-tracked), a real
  # out-of-stock/in-stock transition, identical app/tunnel/session, those two
  # topics DID NOT FIRE. products/update, tested as the control on the same
  # product under the same conditions, delivered in ~1 second, including a
  # genuine Shopify redelivery our own unique-constraint dedup caught. That
  # positive/negative pair under identical conditions is what justified
  # requesting `read_inventory` (see [access_scopes] above) rather than
  # continuing to guess. inventory_levels/update replaces the two topics
  # below it did not verify.
  #
  # THE WEBHOOK IS STILL AN INVALIDATION SIGNAL, NEVER A DATA SOURCE (R15's
  # wording, reaffirmed by R17). The handler never reads a price, quantity or
  # availability value out of the delivered payload — only an identifier
  # telling it which variant to re-check, and even that identifier
  # (`inventory_item_id`) is read from the RAW webhook body as a digit
  # string, never through JSON.parse's already-lossy `number`, because it is
  # a 64-bit id (see the handler's own module comment). Purchasability and
  # the "as low as" figure are always re-resolved from Shopify's and our own
  # CURRENT state afterward — inventory spans locations, so this handler
  # never treats the payload's own `available` field as the answer, only as
  # a hint about which variant to re-check.
  #
  # products/update covers product/variant lifecycle changes (create, delete,
  # status change) that can also flip purchasability, per Shopify's own
  # documentation of when this topic fires, and per the live control above.
  #
  # Routed through OUR OWN receiveShopifyWebhook (HMAC-verified, deduplicated,
  # idempotent — see app/shopify/webhooks/boundaryPreserved.test.ts), never
  # the library's authenticate.webhook, exactly like the compliance topics
  # above.
  [[webhooks.subscriptions]]
  topics = ["inventory_levels/update"]
  uri = "/webhooks/carat/inventory-levels-update"

  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "/webhooks/carat/products-update"

  # Slice 3 task 3-4 (D6, criteria 137-140, docs/specs/SLICE-3-LUXURY-STEALS.md
  # §4.4). With no Cart/Checkout Validation Function in MVP1 (D6), nothing in
  # Shopify's own checkout can refuse an un-acknowledged Luxury Steal line —
  # this delivery is the only enforcement that actually binds. It verifies
  # every Luxury Steal line against stored acknowledgment evidence and holds
  # (never auto-cancels) an order with an unmatched line. Routed through OUR
  # OWN receiveShopifyWebhook, same as every subscription above — see
  # app/shopify/webhooks/luxuryStealOrderHandler.server.ts.
  #
  # `read_orders` already covers receiving this delivery's payload (granted
  # in Slice 2C for draftOrderComplete's response) — no scope change here.
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/carat/orders-create"

  # Slice 9 — Custom Jewelry Design Deposit collection.
  #
  # A SEPARATE TOPIC FROM orders/create, deliberately. A deposit invoice is
  # paid through Shopify's own checkout, so the order exists before the money
  # does — orders/create would fire while it was still unpaid and tell us
  # nothing we could act on. orders/paid fires when the money is actually
  # there, which is the only moment that justifies advancing a project to
  # deposit_charged.
  #
  # NO SCOPE CHANGE. `read_orders` already covers receiving this payload
  # (granted in Slice 2C), and the handler's authoritative draft-order lookup
  # uses `write_draft_orders`, also already granted. A webhook subscription is
  # not a permission.
  [[webhooks.subscriptions]]
  topics = ["orders/paid"]
  uri = "/webhooks/carat/orders-paid"

[app_proxy]
# Storefront requests to
#   https://caratforus-dev.myshopify.com/apps/carat/...
# are forwarded by Shopify to <application_url>/apps/carat/... and verified by
# app/shopify/proxy/verify.ts.
#
# The host tracks application_url and is therefore also a development
# placeholder, updated by `shopify app dev`. `subpath` must stay equal to
# SHOPIFY_APP_PROXY_SUBPATH in app/.env, which the signature check reads.
url = "https://caratforus.fly.dev/apps/carat"
subpath = "carat"
prefix = "apps"

[build]
# Names the store `shopify app dev` opens, so the dev session cannot be pointed
# at the wrong shop by accident.
dev_store_url = "caratforus-dev.myshopify.com"

# Lets the CLI rewrite application_url, redirect_urls and the proxy URL to the
# session's tunnel while `shopify app dev` runs. This is what makes the
# placeholders above workable rather than blocking: the alternative is editing
# three URLs by hand on every run, which is how they end up stale and wrong.
automatically_update_urls_on_dev = true

# =============================================================================
# EVENTS -- Set Your Own Stone compatibility synchronization
# =============================================================================
#
# Two subscriptions, because two different edits can invalidate the derived
# compatibility index and only one of them touches a product.
#
# EVERY METAFIELD KEY IS NAMED, not wildcarded by namespace. Shopify's
# validator requires both namespace and key on a metafield trigger, which is
# stricter than the namespace wildcard first attempted here and better: a
# delivery now identifies the exact field that moved, and an edit to an
# unrelated `carat` metafield (a price, a Luxury Steal flag) does not wake
# this handler at all.
#
# THE PAYLOAD QUERIES RETURN ONLY AN ID, deliberately. The handlers treat a
# delivery as a trigger and re-read everything from Shopify, because a delivery
# can be replayed or arrive after a later edit -- a payload-derived write would
# record whatever Shopify's state was at some arbitrary past moment. Asking for
# the data anyway also broke Shopify's query-complexity limit of 100, which is
# a fair hint that the data was not needed.
# Its api_version is independent of [webhooks] above, so 2026-10 here leaves
# the existing 2026-07 classic deliveries alone.
[events]
api_version = "2026-10"

# -----------------------------------------------------------------------------
# PRODUCT -- the mounting itself
# -----------------------------------------------------------------------------
# NAMESPACE-LEVEL metafield triggers: the key argument is optional, so one
# trigger covers every SYOS field on the product and every one on its variants.
# Variant metafields arrive on this topic because Shopify delivers child-entity
# changes on the parent, which is why there is no ProductVariant topic.
#
# It does mean an edit to an unrelated `carat` metafield -- a price, a Luxury
# Steal flag -- also wakes this handler. That costs one product re-read and
# produces an identical row, which is a better trade than twelve subscriptions
# to maintain by hand every time a field is added.
[[events.subscription]]
handle = "syos-product-compatibility"
topic = "Product"
actions = ["create", "update", "delete"]
triggers = [
  "product.status",
  "product.options.*",
  "product.variants.*",
  "product.metafield(namespace: 'carat').*",
  "product.variants.metafield(namespace: 'carat').*",
]
uri = "/webhooks/carat/events/syos-product"
query = """
query SyosProductEvent($productId: ID!) {
  product(id: $productId) { id }
}
"""

# -----------------------------------------------------------------------------
# METAOBJECT -- the shared centre-size profile
# -----------------------------------------------------------------------------
# THE SUBSCRIPTION THAT PREVENTS A FALSE MATCH. A merchant can edit
# "Pear 10 x 7 mm" from 10.0 to 10.5 without touching any product: the option
# value still points at the same metaobject id, so no Product event fires and
# nothing in the product graph changed. Without this, every mounting using that
# profile would keep being matched against dimensions that no longer exist --
# a wrong compatibility answer, not a stale label.
#
# Requires read_metaobjects. Verified empirically: the topic is refused without
# it, even though app-owned metaobject reads and writes are exempt.
#
# Every trigger names the type, per Shopify's own caution.
[[events.subscription]]
handle = "syos-center-size-profile"
topic = "Metaobject"
actions = ["create", "update", "delete"]
triggers = [
  "metaobject(type: '$app:syos_center_size_profile').*",
]
uri = "/webhooks/carat/events/syos-profile"
query = """
query SyosProfileEvent($metaobjectId: ID!) {
  metaobject(id: $metaobjectId) { id type }
}
"""

# =============================================================================
# APP-OWNED METAOBJECT -- Center Stone Size Profile
# =============================================================================
#
# One entry per REAL centre size, shared by every mounting offered in that
# size. "Pear 10 x 7 mm" means the same measurements catalogue-wide, so the
# dimensions live here once rather than being copied onto every variant that
# offers them.
#
# APP-OWNED (`metaobjects.app.*`), which is what exempts reading AND writing
# these entries from read_metaobjects / write_metaobjects -- Shopify's 2026-04
# change, verified with this app's own token before anything was requested.
# The read_metaobjects scope added above is for the Metaobject EVENTS topic
# only, which is not covered by that exemption.
#
# `access.admin = "merchant_read_write"` is the point: staff maintain profiles
# in Shopify Admin with no custom app involved.
#
# The display name is load-bearing, not cosmetic. Without a display-name field
# Shopify labels the linked option value from the definition, and a probe
# produced the customer-facing label
# "App 424838725633 Probe Center Size Merchant #B1GMFLSE".
[metaobjects.app.syos_center_size_profile]
name = "Center Stone Size Profile"
# THE TOML KEY IS display_name_field, not the GraphQL displayNameKey. Getting
# this wrong is silent and customer-visible: the released definition came back
# with displayNameKey = null, which makes Shopify label the linked option value
# from the definition instead of the entry. A probe produced exactly that --
# "App 424838725633 Probe Center Size Merchant #B1GMFLSE" -- as the
# customer-facing option label.
display_name_field = "display_name"
description = "A real centre-stone size - shape and nominal millimetre dimensions - shared by every mounting offered in that size."
access.admin = "merchant_read_write"
access.storefront = "public_read"

[metaobjects.app.syos_center_size_profile.fields.display_name]
name = "Display Name"
description = "What customers and staff see, for example Pear 10 x 7 mm. This becomes the Center Stone Size option label."
type = "single_line_text_field"
required = true

[metaobjects.app.syos_center_size_profile.fields.stone_shape]
name = "Stone Shape"
description = "The centre-stone shape this size is for. Matching compares shape before any dimension, so a wrong value hides every mounting using this profile."
type = "single_line_text_field"
required = true

[metaobjects.app.syos_center_size_profile.fields.nominal_length_mm]
name = "Nominal Stone Length (mm)"
description = "The centre-stone length this size is built for, in millimetres. For example 10.25."
type = "number_decimal"
required = true

[metaobjects.app.syos_center_size_profile.fields.nominal_width_mm]
name = "Nominal Stone Width (mm)"
description = "The centre-stone width this size is built for, in millimetres."
type = "number_decimal"
required = true

[metaobjects.app.syos_center_size_profile.fields.nominal_depth_mm]
name = "Nominal Stone Depth (mm)"
description = "Optional. The centre-stone depth, if the supplier states one."
type = "number_decimal"
