# CaratForUs Shopify app configuration.
#
# PLACEHOLDER: no live Shopify credentials exist yet (open decision D1; see
# docs/ARCHITECTURE-MVP1.md §12). `client_id` and every `*_url` below are
# illustrative placeholders. This file has not been generated or validated by
# the Shopify CLI against a real app — that happens at the start of slice 2
# when the development store is provisioned, via `shopify app config link` /
# `shopify app deploy`. Treat this as documentation of the intended scopes
# and endpoints per docs/ARCHITECTURE-MVP1.md §5, to be reconciled against
# the CLI-generated file once credentials exist. No Admin API scope is
# requested or exercised by any Slice 0 code path.

name = "CaratForUs"
client_id = "REPLACE_WITH_SHOPIFY_CLIENT_ID"
application_url = "https://REPLACE_WITH_APP_URL.example.com"
embedded = true

[access_scopes]
# Least privilege, per docs/ARCHITECTURE-MVP1.md §5.
scopes = "read_products,write_products,read_orders,write_orders,read_customers,read_inventory,write_discounts,read_fulfillments,write_price_rules"

[webhooks]
api_version = "2025-01"

[app_proxy]
url = "https://REPLACE_WITH_APP_URL.example.com/apps/carat"
subpath = "carat"
prefix = "apps"
