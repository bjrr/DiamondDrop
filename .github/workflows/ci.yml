name: CI

on:
  push:
  pull_request:

# THE ENTIRE PIPELINE RUNS WITH NO LIVE SHOPIFY CREDENTIALS. That guarantee
# is unchanged (open decision D1, see docs/ARCHITECTURE-MVP1.md §12): every
# value below is a hardcoded placeholder in a public file, not a GitHub
# secret and not anything Shopify would accept.
#
# WHY SHOPIFY CONFIG IS SUPPLIED AT ALL, when Slice 0 needed none.
#
# Slice 2 / D13 adopted @shopify/shopify-app-react-router for admin auth.
# `app/shopify.server.ts` calls `requireShopifyConfig()` at MODULE LOAD, which
# is correct — an embedded-admin or OAuth surface that boots without Shopify
# configuration should fail loudly rather than serve a half-configured admin.
#
# Unit tests import the embedded-admin route modules, so they transitively
# load that module and hit that check. With only SHOPIFY_API_SECRET defined,
# 18 test files failed to load with:
#
#   Shopify admin authentication is not configured.
#   Missing: SHOPIFY_API_KEY, SHOPIFY_APP_URL
#
# which is why CI went red at c8c487b (2026-09-17) and stayed red for 105
# consecutive runs through slices 2-13. It never reproduced locally because a
# developer's app/.env supplies both values.
#
# THE FIX BELONGS HERE, NOT IN THE APPLICATION. Making these optional, or
# giving them defaults in app code, would mean a real deployment could boot an
# admin surface with no Shopify configuration and only discover it when a
# customer-facing request failed. CI exercises the whole application including
# those routes, so CI is the right place to supply fake configuration — at the
# boundary, never in application defaults.
#
# Jobs that import no Shopify admin/OAuth code still need none of this; that
# architectural property is unchanged.
env:
  APP_ENV: test
  DATABASE_URL: "postgresql://carat:carat_ci_password@localhost:5432/carat_ci?schema=public"
  SESSION_SECRET: "ci_session_secret_placeholder_not_a_real_secret"
  CRON_SECRET: "ci_cron_secret_placeholder_not_a_real_secret_"
  SHOPIFY_API_SECRET: "ci_shopify_app_secret_placeholder____________"
  SHOPIFY_APP_PROXY_SUBPATH: "carat"
  # Added 2026-10-13 to repair the break described above. Deliberately
  # obvious fakes: a key no Shopify app owns, and a .example host that cannot
  # resolve — RFC 2606 reserves it, so neither can ever be mistaken for, or
  # accidentally reach, a real environment.
  SHOPIFY_API_KEY: "ci_shopify_api_key_placeholder"
  SHOPIFY_APP_URL: "https://ci.caratforus.example"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carat
          POSTGRES_PASSWORD: carat_ci_password
          POSTGRES_DB: carat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carat -d carat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Money safety check (no ad-hoc Math.round/floor/ceil)
        run: npm run check:money-safety

      - name: Unit tests
        run: npm test

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
