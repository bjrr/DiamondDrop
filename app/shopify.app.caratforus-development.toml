# CaratForUs — Shopify app configuration (AUTHORITATIVE).
#
# Generated by `shopify app config link` against the existing
# "caratforus-development" app and then reconciled by hand against
# docs/ARCHITECTURE-MVP1.md §5. This file supersedes the former placeholder
# shopify.app.toml, which carried a fake client_id and has been deleted.
#
# Development store: caratforus-dev.myshopify.com
#
# NOTHING HERE IS SECRET. client_id is a public identifier — it ships in the
# app frontend. The client SECRET lives only in app/.env (gitignored) and is
# never written to this file.
#
# NOT YET DEPLOYED. Values below take effect only on `shopify app deploy`,
# which has deliberately not been run. Three fields are still placeholders and
# are called out individually below.

name = "caratforus-development"
client_id = "f54993df6c413ea67db6fc065a2ebe88"

# PLACEHOLDER — pulled from the app record as "https://example.com".
# `shopify app dev` sets the app's URLs to the tunnel for the duration of a dev
# session. A real, stable URL is only needed for a deployed (staging/prod)
# install, so this is left untouched rather than filled with a guess.
application_url = "https://example.com"

# Embedded in Shopify Admin, per architecture §5 and the app record. The staff
# price-review and admin surfaces render inside Admin via App Bridge.
embedded = true

[access_scopes]
# LEAST PRIVILEGE, NARROWED DELIBERATELY.
#
# `shopify app config link` returned scopes = "" — the app currently requests
# nothing, so no Admin API call would succeed. These are the scopes Slice 2
# actually needs and no more:
#
#   read_products   read variant ids/prices to compare before publishing
#   write_products  publish a recalculated price to a variant
#
# Architecture §5 documents a wider set — read_orders, write_orders,
# read_customers, read_inventory, write_discounts, read_fulfillments,
# write_price_rules. Those are a ROADMAP, not a day-one grant: nothing in the
# codebase exercises any of them yet. Requesting them now would hand the app
# standing access to orders and customer PII months before a line of code reads
# either, which is exactly what least privilege exists to prevent. Each is added
# in the slice that first needs it, and a scope change simply re-prompts on the
# development store.
scopes = "read_products,write_products"
optional_scopes = [ ]

# Token exchange rather than the legacy OAuth redirect dance. Left at the CLI
# default; do not flip this without re-reading the library's install flow.
use_legacy_install_flow = false

[webhooks]
# The CLI reported 2026-07 from the app record. Architecture and .env.example
# previously said 2025-01; both have been updated to match, because a mismatch
# between the version the app is pinned to and the version our client sends is
# the sort of thing that surfaces as an inexplicable field-not-found months
# later. 2026-07 is a current stable version as of this writing.
api_version = "2026-07"

  [webhooks.privacy_compliance]
  # Shopify's mandatory compliance topics. The handlers already exist and are
  # OURS, not the Shopify library's: every inbound request has its HMAC
  # verified over the raw body before any parsing, and processing is
  # deduplicated and idempotent (app/shopify/webhooks/receive.server.ts).
  # Preserving that boundary is a standing architectural requirement — adopting
  # the Shopify library in Slice 2 must not replace it.
  #
  # Paths are relative to application_url and map to the flat routes in
  # app/routes/. UNVALIDATED until the first `shopify app deploy`: the CLI
  # checks these server-side, so treat the first deploy as the test.
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

# No business webhook subscriptions are declared yet. Slice 2 introduces the
# first (order and product topics); adding them here before a handler exists
# would mean Shopify delivering to a 404 and retrying.

[app_proxy]
# PLACEHOLDER URL — carried over from the old placeholder file, not from the
# app record. Must become "<application_url>/apps/carat" before any deploy.
# The subpath matches SHOPIFY_APP_PROXY_SUBPATH in .env, which the proxy
# signature verification in app/shopify/proxy/verify.ts reads.
url = "https://REPLACE_WITH_APP_URL.example.com/apps/carat"
subpath = "carat"
prefix = "apps"

[auth]
# EMPTY, AND THIS BLOCKS OAUTH. The install flow cannot complete until the
# callback URLs are listed here.
#
# Left empty on purpose rather than guessed: the callback paths are defined by
# @shopify/shopify-app-react-router, which is not installed yet (decision D13,
# scheduled for Slice 2). Inventing paths now would produce a config that looks
# configured and fails at install time. They are set as part of that adoption
# task, once the library's actual routes exist — expected to be the tunnel URL
# plus "/auth/callback".
redirect_urls = [ ]
